# The platform on one machine, nothing rented (lát I1): the app, PostgreSQL and an S3-compatible store (SeaweedFS).
# docs/tu-chay.md explains every step.
#   cp deploy/.env.example deploy/.env   # then fill in every value
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: nfc
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: nfc
      # UTF-8 or the Vietnamese checks fail and look like a product bug (operations-gotchas.md).
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes: [db:/var/lib/postgresql]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nfc -d nfc"], interval: 5s, retries: 20 }
    restart: unless-stopped

  # Any S3-compatible store works (lib/media/storage-settings.ts). SeaweedFS: open source (Apache 2.0), one container.
  # MinIO was the first choice and stopped publishing images (found 27/09, operations-gotchas.md). The store gets one
  # key that may write, and anonymous read of the media bucket only -- guests read pictures, nobody lists or writes.
  store:
    image: chrislusf/seaweedfs:4.47
    environment:
      STORE_USER: ${STORE_USER:?set STORE_USER}
      STORE_PASSWORD: ${STORE_PASSWORD:?set STORE_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    # -master.telemetry=false: a self-hosted platform does not report home to anyone without being asked.
    command:
      - >-
        printf '{"identities":[{"name":"nfc","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]},{"name":"anonymous","actions":["Read:nfc-media"]}]}'
        "$$STORE_USER" "$$STORE_PASSWORD" > /tmp/s3.json &&
        exec /entrypoint.sh mini -dir=/data -s3.config=/tmp/s3.json -bucket=nfc-media -master.telemetry=false
    volumes: [store:/data]
    ports: ["127.0.0.1:9000:8333"]
    healthcheck: { test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"], interval: 5s, retries: 30 }
    restart: unless-stopped

  migrate:
    build: { context: .., dockerfile: Dockerfile }
    image: nfc-platform
    pull_policy: build
    command: ["node", "scripts/migrate.mjs"]
    environment: { DATABASE_URL: "postgresql://nfc:${DB_PASSWORD}@db:5432/nfc" }
    depends_on: { db: { condition: service_healthy } }

  app:
    # The same image the migrate step builds; never pulled from a registry.
    build: { context: .., dockerfile: Dockerfile }
    image: nfc-platform
    pull_policy: build
    depends_on:
      migrate: { condition: service_completed_successfully }
      store: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    environment:
      NFC_ENV: production
      SERVER_DATA_ENABLED: "true"
      DATABASE_URL: "postgresql://nfc:${DB_PASSWORD}@db:5432/nfc"
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
      NFC_VISITS_V2_ENABLED: "true"
      NFC_PUBLISHING_ENABLED: "true"
      NFC_OWNER_V2_ENABLED: "true"
      NFC_ADMIN_ENABLED: "true"
      NFC_RENDER_SIGNING_KEY: ${NFC_RENDER_SIGNING_KEY:?set NFC_RENDER_SIGNING_KEY}
      NFC_TOTP_KEY: ${NFC_TOTP_KEY:?set NFC_TOTP_KEY}
      # The one header the proxy in front overwrites with the visitor's address (server/guest-limits.ts).
      NFC_CLIENT_IP_HEADER: ${NFC_CLIENT_IP_HEADER:-}
      # Uploads: any S3-compatible store (lib/media/storage-settings.ts). The browser uploads straight to it, so it
      # must be reachable from the owner's browser at STORAGE_ENDPOINT.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?set STORAGE_ENDPOINT}
      STORAGE_REGION: us-east-1
      R2_ACCESS_KEY_ID: ${STORE_USER}
      R2_SECRET_ACCESS_KEY: ${STORE_PASSWORD}
      R2_BUCKET: nfc-media
      MEDIA_PUBLIC_ORIGIN: ${MEDIA_PUBLIC_ORIGIN:?set MEDIA_PUBLIC_ORIGIN}
      NFC_SUPPORT_CONTACT: ${NFC_SUPPORT_CONTACT:-}
      # Google sign-in for owners (lát D4c); empty hides the buttons.
      NFC_GOOGLE_CLIENT_ID: ${NFC_GOOGLE_CLIENT_ID:-}
      NFC_GOOGLE_CLIENT_SECRET: ${NFC_GOOGLE_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/dieu-khoan').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      retries: 30
    restart: unless-stopped

volumes: { db: {}, store: {} }
