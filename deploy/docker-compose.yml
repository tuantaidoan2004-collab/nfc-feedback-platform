# The platform on one machine, nothing rented (lát I1). docs/tu-chay.md explains every step.
#   cp deploy/.env.example deploy/.env   # then fill in every value
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: nfc
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: nfc
      # UTF-8 or the Vietnamese checks fail and look like a product bug (operations-gotchas.md).
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes: [db:/var/lib/postgresql]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nfc -d nfc"], interval: 5s, retries: 20 }
    restart: unless-stopped

  store:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${STORE_USER:?set STORE_USER}
      MINIO_ROOT_PASSWORD: ${STORE_PASSWORD:?set STORE_PASSWORD}
    volumes: [store:/data]
    ports: ["127.0.0.1:9000:9000"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 20 }
    restart: unless-stopped

  # One-off: the media bucket, readable by anyone (guest pages show its pictures), writable only with a signed URL.
  store-setup:
    image: minio/mc:latest
    depends_on: { store: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://store:9000 \"$$STORE_USER\" \"$$STORE_PASSWORD\" && mc mb --ignore-existing local/nfc-media && mc anonymous set download local/nfc-media"]
    environment: { STORE_USER: "${STORE_USER}", STORE_PASSWORD: "${STORE_PASSWORD}" }

  migrate:
    build: { context: .., dockerfile: Dockerfile }
    image: nfc-platform
    command: ["node", "scripts/migrate.mjs"]
    environment: { DATABASE_URL: "postgresql://nfc:${DB_PASSWORD}@db:5432/nfc" }
    depends_on: { db: { condition: service_healthy } }

  app:
    image: nfc-platform
    depends_on:
      migrate: { condition: service_completed_successfully }
      store-setup: { condition: service_completed_successfully }
    ports: ["127.0.0.1:3000:3000"]
    environment:
      NFC_ENV: production
      SERVER_DATA_ENABLED: "true"
      DATABASE_URL: "postgresql://nfc:${DB_PASSWORD}@db:5432/nfc"
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
      NFC_VISITS_V2_ENABLED: "true"
      NFC_PUBLISHING_ENABLED: "true"
      NFC_OWNER_V2_ENABLED: "true"
      NFC_ADMIN_ENABLED: "true"
      NFC_RENDER_SIGNING_KEY: ${NFC_RENDER_SIGNING_KEY:?set NFC_RENDER_SIGNING_KEY}
      NFC_TOTP_KEY: ${NFC_TOTP_KEY:?set NFC_TOTP_KEY}
      # The one header the proxy in front overwrites with the visitor's address (server/guest-limits.ts).
      NFC_CLIENT_IP_HEADER: ${NFC_CLIENT_IP_HEADER:-}
      # Uploads: any S3-compatible store (lib/media/storage-settings.ts). The browser uploads straight to it, so it
      # must be reachable from the owner's browser at STORAGE_ENDPOINT.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?set STORAGE_ENDPOINT}
      STORAGE_REGION: us-east-1
      R2_ACCESS_KEY_ID: ${STORE_USER}
      R2_SECRET_ACCESS_KEY: ${STORE_PASSWORD}
      R2_BUCKET: nfc-media
      MEDIA_PUBLIC_ORIGIN: ${MEDIA_PUBLIC_ORIGIN:?set MEDIA_PUBLIC_ORIGIN}
      NFC_SUPPORT_CONTACT: ${NFC_SUPPORT_CONTACT:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/dieu-khoan').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      retries: 30
    restart: unless-stopped

volumes: { db: {}, store: {} }
