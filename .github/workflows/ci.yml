name: App checks

# The same seven suites the project runs by hand before every push (docs/operations-gotchas.md). They are split into
# four jobs so the wall clock stays short and so a failure names the area. Each job that needs a database brings its
# own PostgreSQL on port 55439, the port the fixtures and the harness expect, with UTF-8: an SQL_ASCII cluster makes
# the Vietnamese CHECK constraints fail and looks like a product bug (lát A4, 2026-09-20).
on:
  push:
    branches: [main, 'feat/**', 'astra/**']
  pull_request:
permissions:
  contents: read

env:
  NFC_TEST_DATABASE_URL: postgresql://nfc_test@127.0.0.1:55439/nfc_repo_test

jobs:
  static:
    name: types, lint, build, contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # tsc needs the types Next generates for routes; `pnpm typecheck` does this locally, where .next already exists.
      - run: node node_modules/next/dist/bin/next typegen
      - run: node node_modules/typescript/bin/tsc --noEmit -p .
      - run: node node_modules/eslint/bin/eslint.js .
      # The same three the previous workflow gave the build; a page that reads configuration at build time needs them.
      - run: node node_modules/next/dist/bin/next build --webpack
        env:
          SERVER_DATA_ENABLED: 'true'
          APP_ORIGIN: http://127.0.0.1:3000
          NFC_BUILD_TARGET: vercel
      - run: node node_modules/@playwright/test/cli.js test --config=playwright.contracts.config.ts

  client:
    name: client (real Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chrome
      - run: node node_modules/@playwright/test/cli.js test --config=playwright.client.config.ts

  repository:
    name: repository (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nfc_test
          POSTGRES_DB: nfc_repo_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U nfc_test -d nfc_repo_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: the cluster must be UTF-8
        run: node .github/scripts/check-encoding.mjs
      - run: node node_modules/@playwright/test/cli.js test --config=playwright.repository.config.ts

  integration:
    name: integration ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: public
            command: node integration-tests/run-local.mjs public-v2.spec.ts browser-hardening.spec.ts --build
          - name: publishing
            command: node integration-tests/run-local.mjs --publishing publishing.spec.ts --build
          - name: owner
            command: node integration-tests/run-local.mjs --owner owner-dashboard.spec.ts --build
          - name: admin
            command: node integration-tests/run-local.mjs --admin admin-http.spec.ts --build
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nfc_test
          POSTGRES_DB: nfc_repo_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U nfc_test -d nfc_repo_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chrome
      # One hardening case opens Chrome with a window to watch a real tab switch; a runner has no display of its own.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: the cluster must be UTF-8
        run: node .github/scripts/check-encoding.mjs
      # The harness builds and runs the app itself; the three modes exclude each other, hence one per matrix entry.
      - run: xvfb-run -a ${{ matrix.command }}
      # The list reporter names the failing cases; this prints why, so a red run can be read from the log alone.
      - name: why it failed
        if: failure()
        run: |
          for file in test-results/*/error-context.md; do
            [ -e "$file" ] || continue
            echo "::group::$file"
            sed -n '1,80p' "$file"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-${{ matrix.name }}-results
          path: test-results/
          retention-days: 7

  selfhost:
    # Lát I1: the whole platform from the Dockerfile and deploy/docker-compose.yml on a bare runner -- PostgreSQL and
    # SeaweedFS (an S3-compatible store) in containers, nothing rented -- then scripts/selfhost-smoke.mjs against it (docs/tu-chay.md).
    name: self-host (Docker, no rented service)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: a throwaway configuration
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "STORE_USER=nfcstore"
            echo "STORE_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_ORIGIN=http://127.0.0.1:3000"
            echo "NFC_RENDER_SIGNING_KEY=$(openssl rand -hex 32)"
            echo "NFC_TOTP_KEY=$(openssl rand -hex 32)"
            echo "STORAGE_ENDPOINT=http://127.0.0.1:9000"
            echo "MEDIA_PUBLIC_ORIGIN=http://127.0.0.1:9000/nfc-media"
          } > deploy/.env
      - run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
      - name: wait for the app
        run: |
          for i in $(seq 1 90); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/dieu-khoan && exit 0
            sleep 2
          done
          exit 1
      - name: smoke checks
        run: |
          set -a; . deploy/.env; set +a
          R2_ACCESS_KEY_ID="$STORE_USER" R2_SECRET_ACCESS_KEY="$STORE_PASSWORD" R2_BUCKET=nfc-media STORAGE_REGION=us-east-1 \
            node scripts/selfhost-smoke.mjs
      - name: the database is db/schema.sql
        run: |
          test "$(docker compose -f deploy/docker-compose.yml --env-file deploy/.env exec -T db psql -U nfc -d nfc -Atc 'SELECT hash FROM applied_schema')" \
            = "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync('db/schema.sql')).digest('hex').slice(0,16))")"
      - name: why it failed
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --no-color --tail=200
